name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Must be >= the soroban-sdk major (28) — the SDK refuses to build a
  # contract under an older CLI, and an older CLI cannot read a protocol-28
  # network's settings.
  STELLAR_CLI_VERSION: 28.1.0

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the channel; this action honours it and adds
      # the wasm target and the components CI needs.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Cache stellar-cli
        id: cache-stellar
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/stellar
          key: stellar-cli-${{ env.STELLAR_CLI_VERSION }}-${{ runner.os }}

      - name: Install stellar-cli
        if: steps.cache-stellar.outputs.cache-hit != 'true'
        run: cargo install --locked stellar-cli --version ${{ env.STELLAR_CLI_VERSION }}

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Build contract
        run: stellar contract build

      # A contract over the network's 128KB limit cannot be deployed at all,
      # so failing here beats failing at deploy time.
      - name: Check wasm size
        run: |
          wasm=target/wasm32v1-none/release/farmledge_receipt.wasm
          size=$(stat -c%s "$wasm")
          echo "$wasm is $size bytes"
          if [ "$size" -gt 131072 ]; then
            echo "::error::wasm exceeds the 128KB contract size limit"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: farmledge-receipt-wasm
          path: target/wasm32v1-none/release/farmledge_receipt.wasm
